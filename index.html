<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="LaporPak — sistem pemantauan iklan Meta sedang dalam pengembangan.">
  <title>LaporPak — Coming Soon</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:rgba(20,24,33,.74);--line:rgba(255,255,255,.12);--text:#f7f8fb;--muted:#9ca3af;--accent:#ff3b30}
    *{box-sizing:border-box}html,body{min-height:100%}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(255,59,48,.16),transparent 30rem),radial-gradient(circle at 85% 85%,rgba(68,76,231,.12),transparent 34rem),var(--bg)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
    main{position:relative;width:min(92vw,760px);padding:clamp(2rem,6vw,4.5rem);text-align:center;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.42);backdrop-filter:blur(18px)}
    .status{display:inline-flex;align-items:center;gap:.65rem;padding:.55rem .9rem;border:1px solid rgba(255,59,48,.28);border-radius:999px;color:#ffb4ae;background:rgba(255,59,48,.16);font-size:.78rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
    .status:before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .35rem rgba(255,59,48,.13);animation:pulse 1.8s infinite}
    h1{margin:1.7rem 0 .7rem;font-size:clamp(3.4rem,12vw,7rem);line-height:.92;letter-spacing:-.075em}h1 span{color:var(--accent)}
    .lead{max-width:560px;margin:0 auto;color:var(--muted);font-size:clamp(1rem,2vw,1.18rem);line-height:1.75}
    .divider{width:72px;height:3px;margin:2rem auto;border:0;border-radius:99px;background:var(--accent)}
    .foot{margin:0;color:#737b8c;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
    @keyframes pulse{50%{opacity:.48;transform:scale(.86)}}
    @media(max-width:520px){main{border-radius:22px}body:before{background-size:32px 32px}}
    @media(prefers-reduced-motion:reduce){.status:before{animation:none}}
  </style>
</head>
<body>
  <main>
    <div class="status">Dalam Pengembangan</div>
    <h1>Lapor<span>Pak</span></h1>
    <p class="lead">Sistem pemantauan iklan Meta untuk melihat status iklan, lokasi, jenis creative, dan domain tujuan dalam satu dashboard.</p>
    <hr class="divider">
    <p class="foot">Coming Soon</p>
  </main>
</body>
</html>
